<html>
    <head>
        <title>Multipe Select Box</title>
    </head>
    <body>
        <from action="http://www.example.com/profile.php">
            <p>Do play any of the following instruments? (You can select by holding dwon control on a PC or command key on a Mac while selecting defferent options.)</p>
            <select name ="instruments" size="3" multiple="multipe">
                <option value="guitar" size="3" multiple="multiple">Guitar</option>
                <option value="drums">Drums</option>
                <option value="keyboard" selected="selected">keyboard</option>
                <option value="bass">Bass</option>
            </select>
        </from>
    </body>
</html>
